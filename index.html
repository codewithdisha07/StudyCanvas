<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StudyCanvas AI — Digital Study Canvas & Grounded AI Assistant</title>
  <meta name="description"
    content="Intelligent digital study notebook combining handwriting, multi-page vector notes, and a Generative AI assistant strictly grounded in your notes." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('studycanvas_theme') || 'light';
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          localStorage.setItem('studycanvas_theme', 'light');
        }
      } catch (_) { }
    })();
  </script>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-indigo-500/20">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
